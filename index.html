<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Julio Porrino | Plataforma Integral</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#f6f4ef}.serif{font-family:'Instrument Serif',serif}</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect} = React;

const LS_KEY='jp_inmobiliaria_v4';

function App(){
const [tab,setTab]=useState('dashboard');
const [ventas,setVentas]=useState(()=>JSON.parse(localStorage.getItem(LS_KEY+'_ventas')||'[]'));
const [alquileres,setAlquileres]=useState(()=>JSON.parse(localStorage.getItem(LS_KEY+'_alq')||'[]'));
const [admins,setAdmins]=useState(()=>JSON.parse(localStorage.getItem(LS_KEY+'_adm')||'[]'));
const [tasaciones,setTasaciones]=useState(()=>JSON.parse(localStorage.getItem(LS_KEY+'_tas')||'[]'));
const [leads,setLeads]=useState(()=>JSON.parse(localStorage.getItem(LS_KEY+'_leads')||'[]'));
const [foro,setForo]=useState(()=>JSON.parse(localStorage.getItem(LS_KEY+'_foro')||'[{autor:"Julio",msg:"Bienvenidos al foro interno. Coordinemos visitas aquí.",fecha:"Hoy"}]'));
const [toast,setToast]=useState('');

useEffect(()=>{localStorage.setItem(LS_KEY+'_ventas',JSON.stringify(ventas))},[ventas]);
useEffect(()=>{localStorage.setItem(LS_KEY+'_alq',JSON.stringify(alquileres))},[alquileres]);
useEffect(()=>{localStorage.setItem(LS_KEY+'_adm',JSON.stringify(admins))},[admins]);
useEffect(()=>{localStorage.setItem(LS_KEY+'_tas',JSON.stringify(tasaciones))},[tasaciones]);
useEffect(()=>{localStorage.setItem(LS_KEY+'_leads',JSON.stringify(leads))},[leads]);
useEffect(()=>{localStorage.setItem(LS_KEY+'_foro',JSON.stringify(foro))},[foro]);
useEffect(()=>{if(window.lucide) lucide.createIcons()},[tab]);

const notify=(m)=>{setToast(m); setTimeout(()=>setToast(''),3000)}

const initialVenta={titulo:'',precio:'',ubicacion:'F. Alcorta - Balumba',m2c:'',m2t:'',hab:'2',banos:'1',cochera:'Si',estado:'Disponible',tipo:'Casa',desc:'',fotos:['https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=800'],latlng:'-30.8612,-64.5391'};
const [formVenta,setFormVenta]=useState(initialVenta);
const [filtroVenta,setFiltroVenta]=useState('');

const addVenta=()=>{if(!formVenta.titulo)return notify('Falta título'); setVentas([{id:Date.now(),...formVenta},...ventas]); setFormVenta(initialVenta); notify('Propiedad en venta guardada')};

const generarFichaVenta=(p)=>{
 const div=document.createElement('div'); div.style.width='800px'; div.style.background='white'; div.innerHTML=`
 <div style="display:flex"><div style="background:white;width:22%;padding:12px"><img src="logo.png" style="height:64px"/></div><div style="background:#1e345e;width:53%;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white"><p style="font-weight:800;text-align:center">${p.titulo}<br><span style="font-size:14px">${p.ubicacion}</span></p></div><div style="background:#1e345e;width:25%;display:flex;flex-direction:column;justify-content:center;align-items:end;padding-right:12px"><p style="color:#f6e58d;font-weight:800;text-align:right">${p.tipo.toUpperCase()}<br>EN VENTA</p></div></div>
 <div style="display:flex;height:28px"><div style="background:#00a9c9;width:22%"></div><div style="background:#1e345e;width:78%;display:flex;align-items:center;padding-left:8px;color:white;font-size:11px">▶▶ Ubicación: ${p.ubicacion} | ${p.latlng} | USD ${p.precio} | ${p.m2c}m²</div></div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px">${p.fotos.map((u,i)=>`<img src="${u}" style="width:100%;height:${i==0?'220px':'110px'};object-fit:cover" class="${i==0?'col-span-2 row-span-2':''}"/>`).join('')}</div>
 <div style="padding:12px;font-size:11px;display:grid;grid-template-columns:1fr 200px 1fr;gap:12px"><div><b>Descripción:</b><br/>${p.desc}<br/><br/><b>Sup:</b> ${p.m2c}m² cub / ${p.m2t}m² tot | Hab:${p.hab} Baños:${p.banos} Cochera:${p.coches||p.cochera}</div><div style="text-align:center"><img src="logo.png" style="height:56px;margin:auto"/><p style="margin-top:8px"><b>Precio:</b> USD ${p.precio}</p><p>${p.estado}</p></div><div><b>Contacto:</b><br/>martilleroporrino@gmail.com<br/>03548 571577<br/>Deán Funes 460<br/><br/><a href="https://maps.google.com/?q=${p.latlng}">Ver Mapa: ${p.latlng}</a></div></div>`;
 document.body.appendChild(div);
 html2canvas(div,{scale:2,useCORS:true}).then(c=>{const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm','a4'); const w=pdf.internal.pageSize.getWidth(); const h=(c.height*w)/c.width; pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,w,h); pdf.save(`Ficha_${p.titulo.replace(/ /g,'_')}.pdf`); div.remove(); notify('PDF generado')});
};

// ALQUILERES
const initialAlq={titulo:'Depto 1 Dorm Bv San Juan',ubicacion:'Bv. San Juan 781 - Alberdi',alquiler:'550000',deposito:'550000',contrato:'24 meses',actualizacion:'Trimestral IPC',inquilino:'',inicio:'',latlng:'-31.4129,-64.1850',fotos:['https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800']};
const [formAlq,setFormAlq]=useState(initialAlq);
const [calcMonto,setCalcMonto]=useState(550000); const [calcPct,setCalcPct]=useState(20);

return (
<div>
<header className="bg-[#0f2a44] text-white sticky top-0 z-50">
<div className="max-w-[1280px] mx-auto px-4 py-3 flex justify-between items-center">
<div className="flex items-center gap-4"><img src="logo.png" className="h-14 md:h-[72px] bg-white rounded-xl p-2 object-contain"/><div><p className="serif text-xl md:text-2xl leading-none">Julio Porrino</p><p className="text-[10px] tracking-[0.25em] text-[#c8a97e] font-bold mt-1">MP 01-2164 | PLATAFORMA INTEGRAL</p></div></div>
<div className="hidden md:flex gap-2">{[['dashboard','Dashboard'],['ventas','Ventas'],['alquileres','Alquileres'],['admin','Administraciones'],['tasaciones','Tasaciones'],['foro','Foro'],['crm','CRM']].map(([k,l])=><button key={k} onClick={()=>setTab(k)} className={`px-4 py-2 rounded-full text-xs font-bold ${tab===k?'bg-white text-[#0f2a44]':'bg-[#1a3a5a] text-[#8fb0c8]'}`}>{l}</button>)}</div>
</div>
<div className="md:hidden flex gap-2 overflow-x-auto px-4 pb-3">{[['dashboard','Dashboard'],['ventas','Ventas'],['alquileres','Alquileres'],['admin','Admin'],['tasaciones','Tasa'],['foro','Foro'],['crm','CRM']].map(([k,l])=><button key={k} onClick={()=>setTab(k)} className={`px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap ${tab===k?'bg-white text-[#0f2a44]':'bg-[#1a3a5a] text-[#8fb0c8]'}`}>{l}</button>)}</div>
</header>

{toast && <div className="fixed bottom-5 left-1/2 -translate-x-1/2 bg-[#0f2a44] text-white px-6 py-3 rounded-full text-sm font-bold shadow-xl z-[99]">{toast}</div>}

<main className="max-w-[1280px] mx-auto p-4">

{tab==='dashboard' && <div className="grid md:grid-cols-4 gap-4">
<div className="bg-white rounded-[20px] p-6 border"><p className="text-xs font-bold text-slate-400 uppercase">Ventas</p><p className="text-3xl font-extrabold text-[#0f2a44]">{ventas.length}</p><p className="text-xs text-green-600 mt-1">● Activas</p></div>
<div className="bg-white rounded-[20px] p-6 border"><p className="text-xs font-bold text-slate-400 uppercase">Alquileres</p><p className="text-3xl font-extrabold text-[#0f2a44]">{alquileres.length}</p></div>
<div className="bg-white rounded-[20px] p-6 border"><p className="text-xs font-bold text-slate-400 uppercase">Administraciones</p><p className="text-3xl font-extrabold text-[#0f2a44]">{admins.length}</p></div>
<div className="bg-white rounded-[20px] p-6 border"><p className="text-xs font-bold text-slate-400 uppercase">Tasaciones</p><p className="text-3xl font-extrabold text-[#0f2a44]">{tasaciones.length}</p></div>
<div className="md:col-span-2 bg-[#0f2a44] rounded-[20px] p-6 text-white"><h3 className="font-bold">📋 Accesos rápidos</h3><div className="flex gap-2 mt-4 flex-wrap"><button onClick={()=>setTab('ventas')} className="bg-white text-[#0f2a44] px-4 py-2 rounded-full text-xs font-bold">+ Nueva Venta</button><button onClick={()=>setTab('alquileres')} className="bg-[#1a3a5a] px-4 py-2 rounded-full text-xs font-bold">+ Nuevo Alquiler</button><a href="https://www.calculadoracpmcp.com/calculadora.html" target="_blank" className="bg-[#c8a97e] text-[#0f2a44] px-4 py-2 rounded-full text-xs font-bold">🧮 Actualización de Contratos de Alquiler</a></div></div>
<div className="md:col-span-2 bg-white rounded-[20px] p-6 border"><h3 className="font-bold text-[#0f2a44]">Últimas propiedades</h3><div className="mt-3 space-y-2 text-sm">{ventas.slice(0,3).map(v=><div key={v.id} className="flex justify-between border-b pb-2"><span>{v.titulo} - {v.ubicacion}</span><b>USD {v.precio}</b></div>)}</div></div>
</div>}

{tab==='ventas' && <div className="grid md:grid-cols-[380px_1fr] gap-6">
<div className="bg-white rounded-[20px] p-5 border h-fit">
<h3 className="font-extrabold text-[#0f2a44]">Carga Venta</h3>
<input value={formVenta.titulo} onChange={e=>setFormVenta({...formVenta,titulo:e.target.value})} placeholder="Título" className="w-full mt-3 border rounded-xl px-3 py-2 text-sm"/>
<div className="grid grid-cols-2 gap-2 mt-2"><input value={formVenta.precio} onChange={e=>setFormVenta({...formVenta,precio:e.target.value})} placeholder="USD" className="border rounded-xl px-3 py-2 text-sm"/><input value={formVenta.tipo} onChange={e=>setFormVenta({...formVenta,tipo:e.target.value})} placeholder="Tipo" className="border rounded-xl px-3 py-2 text-sm"/></div>
<input value={formVenta.ubicacion} onChange={e=>setFormVenta({...formVenta,ubicacion:e.target.value})} placeholder="Ubicación + lat,lng" className="w-full mt-2 border rounded-xl px-3 py-2 text-sm"/>
<div className="grid grid-cols-3 gap-2 mt-2"><input value={formVenta.m2c} onChange={e=>setFormVenta({...formVenta,m2c:e.target.value})} placeholder="m² cub" className="border rounded-xl px-3 py-2 text-sm"/><input value={formVenta.hab} onChange={e=>setFormVenta({...formVenta,hab:e.target.value})} placeholder="Hab" className="border rounded-xl px-3 py-2 text-sm"/><input value={formVenta.banos} onChange={e=>setFormVenta({...formVenta,banos:e.target.value})} placeholder="Baños" className="border rounded-xl px-3 py-2 text-sm"/></div>
<textarea value={formVenta.desc} onChange={e=>setFormVenta({...formVenta,desc:e.target.value})} placeholder="Descripción comercial" rows="3" className="w-full mt-2 border rounded-xl px-3 py-2 text-sm"></textarea>
<input value={formVenta.latlng} onChange={e=>setFormVenta({...formVenta,latlng:e.target.value})} placeholder="Lat,Lng -30.8612,-64.5391" className="w-full mt-2 border rounded-xl px-3 py-2 text-xs"/>
<input value={formVenta.fotos.join(',')} onChange={e=>setFormVenta({...formVenta,fotos:e.target.value.split(',')})} placeholder="URLs fotos separadas por coma" className="w-full mt-2 border rounded-xl px-3 py-2 text-xs"/>
<select value={formVenta.estado} onChange={e=>setFormVenta({...formVenta,estado:e.target.value})} className="w-full mt-2 border rounded-xl px-3 py-2 text-sm"><option>Disponible</option><option>Reservado</option><option>Vendido</option></select>
<button onClick={addVenta} className="w-full mt-4 bg-[#0f2a44] text-white py-3 rounded-full font-bold text-sm">Guardar Venta</button>
</div>
<div>
<div className="flex gap-2 mb-4"><input value={filtroVenta} onChange={e=>setFiltroVenta(e.target.value)} placeholder="Filtrar por ubicación o precio" className="flex-1 border rounded-full px-4 py-2 text-sm"/><span className="bg-white border px-4 py-2 rounded-full text-xs font-bold">{ventas.filter(v=> (v.ubicacion+v.titulo+v.precio).toLowerCase().includes(filtroVenta.toLowerCase())).length} resultados</span></div>
<div className="grid md:grid-cols-2 gap-4">{ventas.filter(v=> (v.ubicacion+v.titulo+v.precio).toLowerCase().includes(filtroVenta.toLowerCase())).map(v=><div key={v.id} className="bg-white rounded-[20px] p-3 border"><img src={v.fotos[0]} className="w-full h-[180px] object-cover rounded-[14px]"/><div className="p-3"><div className="flex justify-between"><p className="font-extrabold">{v.titulo}</p><span className={`text-[11px] px-2 py-1 rounded-full font-bold ${v.estado==='Disponible'?'bg-green-100 text-green-700':'bg-orange-100 text-orange-700'}`}>{v.estado}</span></div><p className="text-xs text-slate-500">{v.ubicacion} • {v.m2c}m² • {v.latlng}</p><p className="font-bold mt-1">USD {v.precio}</p><div className="flex gap-2 mt-3"><button onClick={()=>generarFichaVenta(v)} className="flex-1 bg-[#0f2a44] text-white py-2 rounded-full text-xs font-bold">📄 Ficha PDF</button><button onClick={()=>{setVentas(ventas.filter(x=>x.id!==v.id)); notify('Eliminado')}} className="px-4 border rounded-full text-xs">Borrar</button></div></div></div>)}</div>
</div>
</div>}

{tab==='alquileres' && <div className="grid md:grid-cols-[380px_1fr] gap-6">
<div className="bg-white rounded-[20px] p-5 border h-fit">
<h3 className="font-bold text-[#0f2a44]">Nuevo Alquiler</h3>
<input value={formAlq.titulo} onChange={e=>setFormAlq({...formAlq,titulo:e.target.value})} placeholder="Título" className="w-full mt-3 border rounded-xl px-3 py-2 text-sm"/>
<input value={formAlq.ubicacion} onChange={e=>setFormAlq({...formAlq,ubicacion:e.target.value})} placeholder="Ubicación" className="w-full mt-2 border rounded-xl px-3 py-2 text-sm"/>
<div className="grid grid-cols-2 gap-2 mt-2"><input value={formAlq.alquiler} onChange={e=>setFormAlq({...formAlq,alquiler:e.target.value})} placeholder="Alquiler" className="border rounded-xl px-3 py-2 text-sm"/><input value={formAlq.deposito} onChange={e=>setFormAlq({...formAlq,deposito:e.target.value})} placeholder="Depósito" className="border rounded-xl px-3 py-2 text-sm"/></div>
<input value={formAlq.inquilino} onChange={e=>setFormAlq({...formAlq,inquilino:e.target.value})} placeholder="Inquilino actual" className="w-full mt-2 border rounded-xl px-3 py-2 text-sm"/>
<input value={formAlq.latlng} onChange={e=>setFormAlq({...formAlq,latlng:e.target.value})} placeholder="Lat,Lng georef" className="w-full mt-2 border rounded-xl px-3 py-2 text-xs"/>
<button onClick={()=>{setAlquileres([{id:Date.now(),...formAlq},...alquileres]); notify('Alquiler guardado')}} className="w-full mt-3 bg-[#0f2a44] text-white py-3 rounded-full font-bold text-sm">Guardar Alquiler</button>
<div className="mt-6 p-4 bg-[#f6f4ef] rounded-xl"><h4 className="font-bold text-sm">Calculadora Actualización</h4><div className="grid grid-cols-2 gap-2 mt-2"><input type="number" value={calcMonto} onChange={e=>setCalcMonto(e.target.value)} className="border rounded-lg px-2 py-1 text-sm"/><input type="number" value={calcPct} onChange={e=>setCalcPct(e.target.value)} placeholder="%" className="border rounded-lg px-2 py-1 text-sm"/></div><p className="font-bold mt-2">Nuevo: $ {(calcMonto*(1+calcPct/100)).toLocaleString()}</p><a href="https://www.calculadoracpmcp.com/calculadora.html" target="_blank" className="inline-block mt-2 bg-[#0f2a44] text-white px-4 py-2 rounded-full text-xs font-bold">🧮 Actualización de Contratos de Alquiler →</a></div>
</div>
<div className="space-y-3">{alquileres.map(a=><div key={a.id} className="bg-white rounded-[20px] p-4 border flex justify-between"><div><p className="font-bold">{a.titulo}</p><p className="text-xs text-slate-500">{a.ubicacion} • {a.latlng} • Inq: {a.inquilino||'Libre'}</p><p className="text-sm mt-1">${a.alquiler} • Dep: ${a.deposito} • {a.contrato}</p></div><iframe src={`https://maps.google.com/maps?q=${a.latlng}&z=15&output=embed`} className="w-[160px] h-[80px] rounded-xl border-0"></iframe></div>)}</div>
</div>}

{tab==='admin' && <div className="grid md:grid-cols-[380px_1fr] gap-6">
<div className="bg-white rounded-[20px] p-5 border"><h3 className="font-bold">Nueva Administración</h3><input id="adm-name" placeholder="Edificio / Unidad" className="w-full mt-3 border rounded-xl px-3 py-2 text-sm"/><input id="adm-exp" placeholder="Expensa $" className="w-full mt-2 border rounded-xl px-3 py-2 text-sm"/><textarea id="adm-nota" placeholder="Nota mantenimiento" rows="3" className="w-full mt-2 border rounded-xl px-3 py-2 text-sm"></textarea><button onClick={()=>{const n=document.getElementById('adm-name').value; const e=document.getElementById('adm-exp').value; const no=document.getElementById('adm-nota').value; if(!n)return; setAdmins([{id:Date.now(),nombre:n,expensa:e,nota:no,pagos:'Al día'},...admins]); notify('Administración creada')}} className="w-full mt-3 bg-[#0f2a44] text-white py-3 rounded-full font-bold text-sm">Guardar</button></div>
<div className="grid md:grid-cols-2 gap-4">{admins.map(a=><div key={a.id} className="bg-white rounded-[20px] p-5 border"><p className="font-bold">{a.nombre}</p><p className="text-sm">Expensa: ${a.expensa} • <span className="bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs">{a.pagos}</span></p><p className="text-xs text-slate-500 mt-2">{a.nota}</p></div>)}</div>
</div>}

{tab==='tasaciones' && <div className="grid md:grid-cols-[380px_1fr] gap-6">
<div className="bg-white rounded-[20px] p-5 border"><h3 className="font-bold">Nueva Tasación</h3><input id="tas-dir" placeholder="Dirección a tasar" className="w-full mt-3 border rounded-xl px-3 py-2 text-sm"/><input id="tas-m2" placeholder="m² totales" className="w-full mt-2 border rounded-xl px-3 py-2 text-sm"/><input id="tas-comp1" placeholder="Comp 1 - Dirección - Precio" className="w-full mt-2 border rounded-xl px-3 py-2 text-xs"/><input id="tas-comp2" placeholder="Comp 2 - Dirección - Precio" className="w-full mt-2 border rounded-xl px-3 py-2 text-xs"/><input id="tas-comp3" placeholder="Comp 3 - Dirección - Precio" className="w-full mt-2 border rounded-xl px-3 py-2 text-xs"/><div className="grid grid-cols-3 gap-2 mt-2"><input id="tas-min" placeholder="Min USD" className="border rounded-xl px-2 py-2 text-xs"/><input id="tas-est" placeholder="Estimado" className="border rounded-xl px-2 py-2 text-xs"/><input id="tas-max" placeholder="Max USD" className="border rounded-xl px-2 py-2 text-xs"/></div><button onClick={()=>{const d=document.getElementById('tas-dir').value; if(!d)return; setTasaciones([{id:Date.now(),dir:d,m2:document.getElementById('tas-m2').value,c1:document.getElementById('tas-comp1').value,c2:document.getElementById('tas-comp2').value,c3:document.getElementById('tas-comp3').value,min:document.getElementById('tas-min').value,est:document.getElementById('tas-est').value,max:document.getElementById('tas-max').value},...tasaciones]); notify('Tasación guardada')}} className="w-full mt-3 bg-[#0f2a44] text-white py-3 rounded-full font-bold text-sm">Guardar Informe</button></div>
<div className="space-y-4">{tasaciones.map(t=><div key={t.id} className="bg-white rounded-[20px] p-6 border"><p className="font-extrabold serif text-xl">{t.dir} - {t.m2}m²</p><p className="text-xs text-slate-500 mt-1">Antecedentes: {t.c1} | {t.c2} | {t.c3}</p><p className="mt-3 text-sm"><b>Rango:</b> USD {t.min} / <b className="text-[#0f2a44] text-lg">{t.est}</b> / {t.max} - <b>USD/m²:</b> {(t.est/t.m2||0).toFixed(0)}</p><button onClick={()=>{const {jsPDF}=window.jspdf; const pdf=new jsPDF(); pdf.text(`TASACION - ${t.dir}`,10,20); pdf.text(`M2: ${t.m2} - Rango Min ${t.min} Est ${t.est} Max ${t.max}`,10,30); pdf.text(`Comparables: ${t.c1} | ${t.c2} | ${t.c3}`,10,40); pdf.save(`Tasacion_${t.dir}.pdf`);}} className="mt-3 border px-4 py-2 rounded-full text-xs font-bold">Exportar PDF Formal</button></div>)}</div>
</div>}

{tab==='foro' && <div className="max-w-[700px] mx-auto bg-white rounded-[20px] p-6 border"><h3 className="font-bold">Foro Interno</h3><div className="mt-4 space-y-3 max-h-[400px] overflow-auto">{foro.map((f,i)=><div key={i} className="border-b pb-3"><p className="font-bold text-sm">{f.autor} <span className="text-xs text-slate-400">{f.fecha}</span></p><p className="text-sm">{f.msg}</p></div>)}</div><div className="flex gap-2 mt-4"><input id="foro-msg" placeholder="Escribir mensaje..." className="flex-1 border rounded-full px-4 py-2 text-sm"/><button onClick={()=>{const m=document.getElementById('foro-msg').value; if(!m)return; setForo([{autor:'Julio',msg:m,fecha:'Ahora'},...foro]); document.getElementById('foro-msg').value=''}} className="bg-[#0f2a44] text-white px-6 rounded-full font-bold text-sm">Enviar</button></div></div>}

{tab==='crm' && <div className="grid md:grid-cols-3 gap-4">
<div className="bg-white rounded-[20px] p-5 border"><h3 className="font-bold">Nuevo Prospecto</h3><input id="crm-n" placeholder="Nombre" className="w-full mt-3 border rounded-xl px-3 py-2 text-sm"/><input id="crm-t" placeholder="Tel" className="w-full mt-2 border rounded-xl px-3 py-2 text-sm"/><input id="crm-int" placeholder="Interés (Ej: Casa 2 dorm)" className="w-full mt-2 border rounded-xl px-3 py-2 text-sm"/><button onClick={()=>{const n=document.getElementById('crm-n').value; if(!n)return; setLeads([{id:Date.now(),nombre:n,tel:document.getElementById('crm-t').value,interes:document.getElementById('crm-int').value,estado:'Nuevo'},...leads]); notify('Lead guardado')}} className="w-full mt-3 bg-[#0f2a44] text-white py-3 rounded-full font-bold text-sm">Guardar</button></div>
<div className="md:col-span-2 bg-white rounded-[20px] p-5 border"><h3 className="font-bold">Prospectos ({leads.length})</h3><div className="mt-3 space-y-2">{leads.map(l=><div key={l.id} className="flex justify-between border rounded-xl p-3"><div><p className="font-bold text-sm">{l.nombre}</p><p className="text-xs text-slate-500">{l.tel} • {l.interes} • {l.estado}</p></div><a href={`https://wa.me/${l.tel.replace(/[^0-9]/g,'')}`} className="bg-green-500 text-white px-4 py-2 rounded-full text-xs font-bold">WhatsApp</a></div>)}</div></div>
</div>}

</main>
</div>
);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
